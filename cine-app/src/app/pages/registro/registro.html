<main class="auth">
  <h1>Crear cuenta</h1>
  <input type="text" placeholder="Nombre" [(ngModel)]="nombre" />
  <input type="email" placeholder="Email" [(ngModel)]="email" />
  <input type="password" placeholder="Contraseña (mín. 6)" [(ngModel)]="password" />
  @if (error()) { <p class="error">{{ error() }}</p> }
  <button (click)="registrar()" [disabled]="cargando()">Registrarme</button>
  <p>¿Ya tenés cuenta? <a routerLink="/login">Ingresá</a></p>
</main>
